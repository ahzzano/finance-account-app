spring.application.name=finance-backend

# Loads local secrets from backend/.env when present; real env vars take precedence.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET search_path TO ${DB_SCHEMA:public}, extensions
spring.mvc.problemdetails.enabled=true